name: 同步发行版并构建站点

on:
  push:
    branches: [master, main]
  schedule:
    # 每小时拉一次上游 Release（GitHub Actions 的 cron 是 UTC）
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 同步发行版数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: node scripts/sync-releases.mjs

      - name: 数据冒烟检查
        run: node scripts/smoke-downloads.mjs

      - name: 回写同步结果（站点直接由 master 分支服务，数据要留在仓库里）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/data assets/releases.json data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "sync: 更新发行版快照 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 并发触发（push + schedule）时远端可能已经有新提交，先 rebase 再推
          git pull --rebase --autostash origin master || true
          git push || echo "推送失败（并发冲突），本次改动留给下一次运行"

      - name: 组装 dist
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 默认不部署：仓库现在由 GitHub Pages 直接服务 master 分支根目录（legacy 模式），
  # 如果改成「GitHub Actions」作为 Pages 源，把仓库变量 PAGES_SOURCE 设为 actions
  # 这一 job 就会接管部署。
  deploy:
    needs: build
    if: vars.PAGES_SOURCE == 'actions'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 可选：再把同一份 dist 推到 Cloudflare Pages。
  # 配好 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 后取消注释即可。
