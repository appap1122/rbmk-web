name: 同步发行版并构建站点

on:
  push:
    branches: [master, main]
  schedule:
    # 每小时拉一次上游 Release（GitHub Actions 的 cron 是 UTC）
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Cloudflare Pages 项目名；仓库变量 CLOUDFLARE_PROJECT_NAME 可覆盖
  CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'rbmk-hub' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 同步发行版数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: node scripts/sync-releases.mjs

      - name: 数据冒烟检查
        run: node scripts/smoke-downloads.mjs

      - name: 回写同步结果（站点直接由 master 分支服务，数据要留在仓库里）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/data assets/releases.json data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "sync: 更新发行版快照 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 并发触发（push + schedule）时远端可能已经有新提交，先 rebase 再推
          git pull --rebase --autostash origin master || true
          git push || echo "推送失败（并发冲突），本次改动留给下一次运行"

      - name: 组装 dist
        run: node scripts/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---------- Cloudflare Pages ----------
  # 构建在 Actions 里完成，Cloudflare 只接收 dist/ 产物。
  # 需要两个 Secret：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID。
  # 没配时这一步只给 warning，不会让工作流红叉。
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 检查 Cloudflare 凭据
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "凭据已配置，准备部署到 Cloudflare Pages（项目：${{ env.CF_PROJECT }}）"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过 Cloudflare Pages 部署（dist 产物仍已上传）"
          fi

      - name: 部署到 Cloudflare Pages
        if: steps.guard.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PROJECT }} --branch=master

  # ---------- GitHub Pages（可选） ----------
  # 仓库目前由 master 分支根目录直接服务；把仓库变量 PAGES_SOURCE 设成 actions
  # 就由这个 job 接管部署。
  deploy:
    needs: build
    if: vars.PAGES_SOURCE == 'actions'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
