name: sync-releases
# 每 30 分钟抓取 Gitee / GitHub 四个仓库的发行版，生成 assets/releases.json 快照。
# 快照变化时自动提交 → GitHub Pages 自动重新部署；无变化则不产生提交。
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取发行版生成快照
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 可选：在仓库 Secrets 里配置 GITEE_TOKEN（只读权限即可）可彻底避开 Gitee 匿名限流
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: node scripts/sync-releases.mjs

      - name: 提交快照（有变化才提交）
        run: |
          git config user.name "release-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/releases.json
          if git diff --cached --quiet; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "sync: 更新发行版快照 $(date -u '+%FT%TZ')"
            git push
          fi
